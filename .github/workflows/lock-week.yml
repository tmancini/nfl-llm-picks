name: Lock week

on:
  schedule:
    - cron: "0 14 * * 3"
    - cron: "0 1 * * 4"
  workflow_dispatch:
    inputs:
      revise:
        description: "Revise an already locked week with independent, odds-free picks"
        type: boolean
        required: false
        default: false
      season:
        description: "Season for revision (required when revise is true)"
        type: number
        required: false
      week:
        description: "Week for revision (required when revise is true)"
        type: number
        required: false

permissions:
  contents: write

concurrency:
  group: lock-week
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lock current ESPN week
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ENABLE_PAID_PICKS: "1"
          REVISE: ${{ inputs.revise }}
          LOCK_SEASON: ${{ inputs.season }}
          LOCK_WEEK: ${{ inputs.week }}
        run: |
          if [ "$REVISE" = "true" ]; then
            if [ -z "$LOCK_SEASON" ] || [ -z "$LOCK_WEEK" ]; then
              echo "Revision requires season and week inputs" >&2
              exit 1
            fi
            pnpm lock-week --season "$LOCK_SEASON" --week "$LOCK_WEEK" --revise
          else
            pnpm lock-week
          fi
      - name: Commit locked week
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No week file changes"
          else
            git commit -m "Lock NFL week picks"
            git push
          fi
